# The calibre this fork's Python runs on, for a Linux job.
#
# Installs the runtime libraries calibre's bundled Qt needs on a bare Ubuntu,
# then (unless packages-only) downloads the Linux installer for the release
# pinned in packaging/upstream.json, checks its sha256, and unpacks it. The
# tarball is cached by digest, so a run after the first only pays for the
# unpack. Nothing is compiled: this is the same binary a user installs.
#
# Used by zen-ci.yml to run the tests, and by zen-package.yml for the library
# list alone -- package.sh does its own download, because it also runs outside
# GitHub.
name: calibre runtime
description: Qt's runtime libraries, and calibre's pinned Linux release, unpacked

inputs:
  packages-only:
    description: Install the apt packages and stop; do not download calibre
    required: false
    default: 'false'

outputs:
  dir:
    description: The unpacked calibre directory (holds calibre-debug, resources/)
    value: ${{ steps.unpack.outputs.dir }}
  calibre-debug:
    description: Path to the unpacked calibre-debug
    value: ${{ steps.unpack.outputs.calibre_debug }}
  version:
    description: The pinned calibre version
    value: ${{ steps.pin.outputs.version }}

runs:
  using: composite
  steps:
    # Most of this is on the runner image already; the list is what a bare
    # Ubuntu needs, so it also holds under act.
    - name: Install Qt's runtime libraries
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -qq
        # Ubuntu 24.04's time_t transition renamed some of these with a t64
        # suffix and apt will not always resolve the old name, so ask for
        # whichever spelling this release has.
        pkgs=""
        for p in python3 git curl ca-certificates xz-utils tzdata \
          libegl1 libopengl0 libgl1 libxcb-cursor0 libxkbcommon0 libxkbcommon-x11-0 \
          libfontconfig1 libglib2.0-0 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
          libxtst6 libasound2 libdbus-1-3 libxkbfile1 libxcb-icccm4 libxcb-image0 \
          libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
          libxcb-xfixes0 libxcb-xkb1 libxi6 libxrender1 libxext6 libx11-xcb1 \
          libxcb-glx0 libcups2 libpulse0 libspeechd2 libgbm1 libdrm2 libxshmfence1 \
          libwayland-client0 libwayland-egl1; do
          # A purely virtual name still exits 0 here; only a real package prints a stanza.
          if apt-cache show "$p" 2>/dev/null | grep -q '^Package:'; then
            pkgs="$pkgs $p"
          elif apt-cache show "${p}t64" 2>/dev/null | grep -q '^Package:'; then
            pkgs="$pkgs ${p}t64"
          else
            echo "no such package: $p" >&2; exit 1
          fi
        done
        # shellcheck disable=SC2086
        sudo apt-get install -y -qq --no-install-recommends $pkgs

    - name: Read the pin
      if: inputs.packages-only != 'true'
      id: pin
      shell: bash
      run: |
        case "$(uname -m)" in
          x86_64) key=linux-x86_64 ;;
          aarch64) key=linux-arm64 ;;
          *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
        esac
        python3 - "$key" <<'PY' >> "$GITHUB_OUTPUT"
        import json, sys
        d = json.load(open('packaging/upstream.json'))
        a = d['assets'][sys.argv[1]]
        print('version=' + d['version'])
        print('asset=' + a['name'])
        print('sha256=' + a['sha256'])
        print('repo=' + d['repo'])
        print('archive=' + d['archive'])
        print('mirror=' + d['mirror'])
        PY
        cat "$GITHUB_OUTPUT"

    - name: Cached installer
      if: inputs.packages-only != 'true'
      id: cache
      uses: actions/cache@v4
      with:
        path: .calibre-zen/upstream/${{ steps.pin.outputs.asset }}
        key: calibre-installer-${{ steps.pin.outputs.sha256 }}

    # The same three sources, in the same order, as packaging/linux/package.sh.
    - name: Download the installer
      if: inputs.packages-only != 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.pin.outputs.version }}
        ASSET: ${{ steps.pin.outputs.asset }}
        UPSTREAM_REPO: ${{ steps.pin.outputs.repo }}
        ARCHIVE: ${{ steps.pin.outputs.archive }}
        MIRROR: ${{ steps.pin.outputs.mirror }}
      run: |
        mkdir -p .calibre-zen/upstream
        out=".calibre-zen/upstream/$ASSET"
        for url in "https://github.com/$MIRROR/releases/download/upstream-$VERSION/$ASSET" \
                   "$ARCHIVE/$VERSION/$ASSET" \
                   "https://github.com/$UPSTREAM_REPO/releases/download/v$VERSION/$ASSET"; do
          echo "downloading $url"
          if curl -fL --retry 3 -o "$out.part" "$url"; then break; fi
          rm -f "$out.part"
        done
        [ -f "$out.part" ] || { echo "could not download $ASSET" >&2; exit 1; }
        mv "$out.part" "$out"

    - name: Verify and unpack
      if: inputs.packages-only != 'true'
      id: unpack
      shell: bash
      env:
        ASSET: ${{ steps.pin.outputs.asset }}
        SHA256: ${{ steps.pin.outputs.sha256 }}
      run: |
        tarball=".calibre-zen/upstream/$ASSET"
        echo "$SHA256  $tarball" | sha256sum -c --quiet - || { echo "$ASSET does not match packaging/upstream.json" >&2; exit 1; }
        dir="$RUNNER_TEMP/calibre"
        rm -rf "$dir" && mkdir -p "$dir"
        tar -xJf "$tarball" -C "$dir"
        [ -x "$dir/calibre-debug" ] || { echo "no calibre-debug at the top of $ASSET" >&2; exit 1; }
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "calibre_debug=$dir/calibre-debug" >> "$GITHUB_OUTPUT"
        "$dir/calibre-debug" --version
