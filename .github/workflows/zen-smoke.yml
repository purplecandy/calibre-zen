# Step 1 of getting a Linux build out of CI: does a jammy container job work?
#
# This builds nothing. It proves the recipe resolves -- that every apt package
# name exists in jammy, that a Python new enough for bypy can be layered on
# top, that the pip toolchain wins on PATH, and that bypy imports -- before we
# spend hours discovering any of it the hard way.
#
# Throwaway. Folded into zen-deps.yml once it is green.
name: zen smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jammy:
    name: jammy container
    runs-on: ubuntu-latest
    # Not the runner's own userspace. Whatever glibc compiles calibre-zen
    # becomes the floor for everyone who runs it; jammy's 2.35 is the floor
    # calibre itself targets, and it is the same base bypy's own chroot uses.
    # ubuntu-latest would set that floor at 2.39 and exclude Debian 12,
    # Ubuntu 22.04 and RHEL 9 -- most of the people who would install this.
    container: ubuntu:22.04
    timeout-minutes: 20
    # At job level so every step inherits it. Without it, tzdata -- which
    # arrives as a transitive dependency of python3.12, not of anything we ask
    # for -- opens a debconf dialog and waits for an answer that never comes.
    # The job does not fail, it hangs until the timeout.
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

    steps:
      # Before any checkout: actions/checkout wants git, and the base image has
      # none.
      - name: Install the build tools
        run: |
          set -eux
          # Some packages read /etc/localtime rather than $TZ, and prompt when
          # it is absent regardless of DEBIAN_FRONTEND.
          ln -snf /usr/share/zoneinfo/Etc/UTC /etc/localtime
          apt-get update
          # No meson, cmake or ninja here on purpose: they are installed from
          # pip below, and having both would leave which one runs depending on
          # /usr/local/bin preceding /usr/bin -- an implicit dependency in a
          # build that runs for hours.
          apt-get install -y --no-install-recommends \
            build-essential pkg-config nasm yasm \
            autoconf automake libtool gettext texinfo patch file \
            git curl wget ca-certificates rsync zip unzip xz-utils bzip2 \
            python3 python3-dev python3-pip python3-venv python3-setuptools \
            zsh flex bison gperf ruby perl

      # From bypy/linux.conf's `deps` line. The existing zen-deps workflow
      # installs almost none of these, which would have killed qt-base a few
      # dependencies after the one that actually failed.
      - name: Install Qt's build requirements
        run: |
          set -eux
          apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxcb1-dev libx11-xcb-dev libxcb-glx0-dev libxcb-keysyms1-dev \
            libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev \
            libxcb-sync0-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-xinerama0-dev \
            libxcb-util-dev libxcb-cursor-dev libxcb-xkb-dev xkb-data \
            libglu1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxkbfile-dev libinput-dev libgtk2.0-dev libvulkan-dev \
            libwayland-dev libwayland-egl1-mesa libegl1-mesa-dev \
            libxtst-dev libnss3-dev libfreetype6-dev libfontconfig-dev \
            libdrm-dev libxshmfence-dev libcups2-dev libgbm-dev \
            libpulse-dev libasound2-dev flite1-dev libspeechd-dev

      # bypy imports tomllib, which is Python 3.11+, and jammy ships 3.10 --
      # verified: it fails at import, not at some later runtime edge. The
      # interpreter that drives the build is not the one that ends up in the
      # bundle, because bypy compiles that itself, so this changes no ABI.
      #
      # Two wrong answers preceded this one, both instructive:
      #
      #   deadsnakes PPA -- Launchpad rate-limits CI addresses and returned a
      #   503 part-way through the download. A re-run would likely have passed,
      #   which is exactly why it is the wrong answer: it would sit in the
      #   critical path of every build forever.
      #
      #   actions/setup-python -- hands back an interpreter built for the
      #   *runner's* OS, not the container's. It detects the host, and the tool
      #   cache is mounted in from outside, so we got a Python needing
      #   GLIBC_2.38 on a glibc 2.35 image. The trap we containerised to avoid,
      #   walking in through the front door.
      #
      # uv's interpreters are python-build-standalone builds, which target a
      # deliberately old glibc so they run anywhere, and they come from GitHub
      # releases rather than a PPA.
      - name: Install a Python bypy can run on
        run: |
          set -eux
          curl -LsSf https://astral.sh/uv/install.sh | sh
          "$HOME/.local/bin/uv" venv --python 3.12 /opt/py
          /opt/py/bin/python --version
          # Ahead of /usr/bin, so `python` means this one for every later step.
          echo /opt/py/bin >> "$GITHUB_PATH"

      # jammy's meson is 0.61 and glib 2.88 -- the dependency that actually
      # failed -- needs >= 1.4. cmake is held below 4 on purpose: CMake 4
      # rejects any project declaring cmake_minimum_required below 3.5, and a
      # 127-dependency tree has plenty of those. pip's wheels are manylinux
      # builds, so the toolchain moves forward while the ABI floor stays put.
      - name: Install a modern meson and cmake
        run: |
          set -eux
          # uv venv makes an environment without pip in it, so install with uv
          # itself. The console scripts land in /opt/py/bin, which is already
          # ahead of /usr/bin, so there is exactly one meson and one cmake on
          # PATH and no question about which runs.
          "$HOME/.local/bin/uv" pip install --python /opt/py/bin/python \
            certifi html5lib 'meson>=1.4' 'cmake>=3.29,<4' 'ninja>=1.11'

      - name: Check out calibre-zen
        uses: actions/checkout@v4
        with:
          path: root/src
          persist-credentials: false

      - name: Check out bypy
        uses: actions/checkout@v4
        with:
          repository: kovidgoyal/bypy
          # Pinned. bypy is someone else's master branch and it decides which
          # version of every dependency gets built; floating on it means a
          # build that worked yesterday can fail today for reasons that are
          # not in this repository. Move it deliberately.
          ref: a9864eaa056b7592b53269cc3ee2ccdb5bda46b8
          path: root/bypy
          persist-credentials: false

      - name: Report the toolchain
        run: |
          echo "glibc: $(ldd --version | head -1)"
          echo
          for t in meson cmake ninja nasm gperf bison flex zsh python; do
            printf '%-10s %s\n' "$t" "$(command -v $t || echo MISSING)"
          done
          echo
          echo "meson  $(meson --version)"
          cmake --version | head -1
          ninja --version
          python --version

      # The check that matters, and the one a syntax check would have missed:
      # not "does bypy parse" but "does bypy import".
      - name: Can bypy import?
        working-directory: root/src
        run: |
          python -c "
          import sys
          sys.path.insert(0, '../bypy')
          import bypy.main
          print('bypy imports OK on', sys.version.split()[0])
          "
