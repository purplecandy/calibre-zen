# Build calibre-zen's dependency tree for one platform and publish it as a
# release asset.
#
# This is the slow half -- every one of calibre's ~71 dependencies, Qt
# included, built from source -- and it only changes when a dependency version
# does, so it is deliberately manual. The installer workflow downloads what
# this produces instead of rebuilding it.
#
# bypy's own documentation says the macOS and Windows stages must run inside
# QEMU VMs driven from Linux. That is true of `bypy macos` and `bypy windows`,
# which are rsync-over-SSH wrappers; `dependencies` and `program` underneath
# them are ordinary sub-commands that run on whatever machine invokes them,
# which is what makes a hosted runner work at all. See BUILDING.md.
name: zen deps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to build dependencies for
        required: true
        type: choice
        options: [linux, macos, windows]

permissions:
  contents: write # to publish the tarball as a release asset

jobs:
  deps:
    name: ${{ inputs.platform }} dependencies
    runs-on: >-
      ${{ inputs.platform == 'linux' && 'ubuntu-latest'
       || inputs.platform == 'macos' && 'macos-latest'
       || 'windows-latest' }}
    timeout-minutes: 350 # the job cap is 360

    steps:
      - name: Check out calibre-zen
        uses: actions/checkout@v4
        with:
          path: root/src
          persist-credentials: false

      - name: Check out bypy
        uses: actions/checkout@v4
        with:
          repository: kovidgoyal/bypy
          path: bypy
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build tools
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config gperf bison flex \
            python3-dev libglib2.0-dev libgl1-mesa-dev libxkbcommon-dev \
            libfontconfig1-dev nasm

      - name: Build the dependencies
        env:
          BYPY_ROOT: ${{ github.workspace }}/root
          BYPY_UNIVERSAL: ${{ inputs.platform == 'macos' && 'true' || 'false' }}
        run: python bypy BYPY_ROOT="$BYPY_ROOT" BYPY_UNIVERSAL="$BYPY_UNIVERSAL" dependencies
        shell: bash

      - name: Pack them
        id: pack
        run: |
          cd "${{ github.workspace }}/root/src/bypy/b/${{ inputs.platform }}"
          [ -d pkg ] || { echo "no pkg directory -- nothing was built"; exit 1; }
          tar -caf "${{ github.workspace }}/${{ inputs.platform }}-deps.tar.xz" pkg
          ls -la "${{ github.workspace }}/${{ inputs.platform }}-deps.tar.xz"
        shell: bash

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deps
          name: Build dependencies
          body: |
            Prebuilt dependency trees, consumed by the `zen build` workflow.
            Rebuilt only when a dependency version changes.
          files: ${{ github.workspace }}/${{ inputs.platform }}-deps.tar.xz
