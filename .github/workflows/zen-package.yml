# Package calibre-zen for release.
#
# Nothing is compiled here. Each job downloads calibre's own installer for
# the release pinned in packaging/upstream.json, verifies it, and lays this
# fork's Python over it -- see packaging/<os>/package.* and BUILDING.md.
# Minutes per platform, on plain hosted runners.
name: zen package

on:
  push:
    # zen is the release branch: this fork's commits on top of one upstream
    # release tag (BUILDING.md). Every push to it packages all four.
    branches: [zen]
    # Release tags are v<zen_version>, e.g. v0.1.0. Upstream's tags are v*
    # too (v9.14.0); the version job refuses any tag that is not exactly
    # 'v' + the zen_version in constants.py, so pushing one of theirs here
    # builds nothing.
    tags: ['v*']
    paths:
      - .github/workflows/zen-package.yml
      - packaging/**
      - src/**
      - resources/**
  pull_request:
    paths:
      - .github/workflows/zen-package.yml
      - packaging/**
      - src/**
      - resources/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One place the fork's version is read from, and the gate for tag builds.
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      zen: ${{ steps.read.outputs.zen }}
      calibre: ${{ steps.read.outputs.calibre }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: read
        run: |
          zen=$(sed -n "s/^zen_version = '\([^']*\)'/\1/p" src/calibre/constants.py)
          calibre=$(python3 -c "import json; print(json.load(open('packaging/upstream.json'))['version'])")
          [ -n "$zen" ] || { echo "no zen_version in constants.py" >&2; exit 1; }
          echo "calibre-zen $zen on calibre $calibre"
          echo "zen=$zen" >> "$GITHUB_OUTPUT"
          echo "calibre=$calibre" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF" in
            refs/tags/*)
              [ "$GITHUB_REF_NAME" = "v$zen" ] || {
                echo "tag $GITHUB_REF_NAME does not match zen_version $zen; bump constants.py first, and never push upstream's tags here" >&2
                exit 1
              } ;;
          esac

  linux:
    name: linux ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60 # Flatpak also downloads the SDK and runtime
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # package.sh diffs resources/ against the upstream tag, and fetches
          # the tag itself if it is missing, so a shallow clone is fine.

      # The runtime the downloaded Qt needs, for the offscreen precompile and
      # smoke test. The list lives in the action, shared with zen-ci.yml;
      # package.sh does its own download, so only the packages are wanted here.
      - name: Install Qt's runtime libraries
        uses: ./.github/actions/calibre-runtime
        with:
          packages-only: 'true'

      - name: Package
        run: packaging/linux/package.sh ${{ matrix.arch }}

      - name: Check installation from the archive
        run: |
          name="calibre-zen-${{ needs.version.outputs.zen }}-linux-${{ matrix.arch }}.txz"
          mkdir -p "$RUNNER_TEMP/zen-install-check"
          cd "$RUNNER_TEMP/zen-install-check"
          sh "$GITHUB_WORKSPACE/packaging/linux/install-zen.sh" "$GITHUB_WORKSPACE/dist/$name"
          sh ./calibre-zen/install-zen.sh --check
          ./calibre-zen/zen-bin/zen-calibredb --version

      - name: Install Flatpak builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder bzip2 xz-utils

      - name: Package Flatpak
        run: packaging/flatpak/package.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: calibre-zen-linux-${{ matrix.arch }}
          path: |
            dist/*.txz
            dist/*.flatpak
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0 # the .txz is already compressed

  macos:
    name: macos (universal)
    if: github.event_name != 'pull_request'
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60 # notarization waits on Apple
    env:
      # At job level so a step's `if` can see whether signing is configured;
      # an `if` cannot read its own step's env. Absent, the bundle is built
      # unsigned -- which is what a fork of this repo, with no secrets, gets.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The Developer ID certificate and the App Store Connect key arrive as
      # base64 secrets and are written to files only this job can read.
      - name: Unpack the signing credentials
        id: creds
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          d="$RUNNER_TEMP/signing"
          mkdir -p "$d" && chmod 700 "$d"
          printf %s "$MACOS_CERT_P12" | base64 --decode > "$d/cert.p12"
          printf %s "$MACOS_NOTARY_KEY" | base64 --decode > "$d/notary.p8"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          CALIBRE_ZEN_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          CALIBRE_ZEN_SIGN_P12: ${{ steps.creds.outputs.dir && format('{0}/cert.p12', steps.creds.outputs.dir) }}
          CALIBRE_ZEN_SIGN_P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          CALIBRE_ZEN_NOTARY_KEY: ${{ steps.creds.outputs.dir && format('{0}/notary.p8', steps.creds.outputs.dir) }}
          CALIBRE_ZEN_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          CALIBRE_ZEN_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          CALIBRE_ZEN_NOTARIZE: ${{ steps.creds.outputs.dir && '1' || '0' }}
        run: |
          # Both halves or neither: an identity without its certificate would
          # send sign.py to a login keychain the runner does not have.
          if [ -n "$CALIBRE_ZEN_SIGN_IDENTITY" ] && [ ! -s "${CALIBRE_ZEN_SIGN_P12:-/nonexistent}" ]; then
            echo "MACOS_SIGN_IDENTITY is set but MACOS_CERT_P12 is not; building unsigned" >&2
            unset CALIBRE_ZEN_SIGN_IDENTITY
          fi
          packaging/macos/package.sh

      - name: Shred the signing credentials
        if: always() && steps.creds.outputs.dir != ''
        run: rm -rf "${{ steps.creds.outputs.dir }}"

      - uses: actions/upload-artifact@v4
        with:
          name: calibre-zen-macos
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0 # the .dmg is already compressed

  windows:
    name: windows x64
    if: github.event_name != 'pull_request'
    needs: version
    runs-on: windows-latest
    timeout-minutes: 75 # WiX compresses a gigabyte, then the .msi is installed and removed
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Package
        shell: pwsh
        env:
          # Install the .msi and run the portable installer on this runner,
          # then check what they left. Never on a developer's machine.
          CALIBRE_ZEN_INSTALL_TEST: '1'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\package.ps1

      # One artifact per package, so each can be downloaded on its own rather
      # than as one gigabyte bundle. (GitHub wraps every artifact in a zip of
      # its own; nothing to be done about that.)
      - uses: actions/upload-artifact@v4
        with:
          name: calibre-zen-windows-x64-msi
          path: |
            dist/*.msi
            dist/*.msi.sha256
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: calibre-zen-windows-x64-portable-installer
          path: |
            dist/*.exe
            dist/*.exe.sha256
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: calibre-zen-windows-x64-zip
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: calibre-zen-windows-x64-msix
          path: |
            dist/*.msix
            dist/*.msix.sha256
          if-no-files-found: error
          compression-level: 0

  # A tag push also collects the packages into a draft release, plus a source
  # tarball, to be given notes and published by hand. Nothing is public until
  # then. The set of files matches an upstream release (two .txz, .dmg, .msi,
  # portable installer, source) plus Flatpaks, the Store .msix and the .zip.
  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      # The tree as tagged; upstream's sdist adds generated forms and
      # translations, which this fork does not carry.
      - name: Source tarball
        run: |
          name="calibre-zen-${{ needs.version.outputs.zen }}"
          git archive --format=tar --prefix="$name/" "$GITHUB_SHA" | xz -9 > "packages/$name.tar.xz"
          (cd packages && sha256sum "$name.tar.xz" > "$name.tar.xz.sha256")

      - name: Linux installer
        run: cp packaging/linux/install-zen.sh packages/install-zen.sh

      # The release feed the app's update check reads (src/calibre_zen/update.py):
      # the versions, the release page, and every file with its digest and size.
      # GitHub serves the newest *published* release's copy at
      # releases/latest/download/latest.json, so a draft announces nothing.
      - name: Release feed
        env:
          ZEN: ${{ needs.version.outputs.zen }}
          CALIBRE: ${{ needs.version.outputs.calibre }}
        run: |
          python3 - <<'EOF'
          import glob, json, os
          zen, calibre = os.environ['ZEN'], os.environ['CALIBRE']
          assets = {}
          for f in sorted(glob.glob('packages/*.sha256')):
              digest, name = open(f).read().split()
              name = os.path.basename(name)
              assets[name] = {'sha256': digest, 'size': os.path.getsize(os.path.join('packages', name))}
          feed = {
              'zen_version': zen,
              'calibre_version': calibre,
              'url': f'https://github.com/${{ github.repository }}/releases/tag/v{zen}',
              'assets': assets,
          }
          with open('packages/latest.json', 'w') as f:
              json.dump(feed, f, indent=2, sort_keys=True)
              f.write('\n')
          print(open('packages/latest.json').read())
          EOF

      - name: What we are releasing
        run: ls -la packages && cat packages/*.sha256

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: calibre-zen ${{ needs.version.outputs.zen }}
          body: |
            calibre-zen ${{ needs.version.outputs.zen }}, on calibre ${{ needs.version.outputs.calibre }}.
          files: |
            packages/*.txz
            packages/*.flatpak
            packages/*.dmg
            packages/*.msi
            packages/*.exe
            packages/*.zip
            packages/*.msix
            packages/*.tar.xz
            packages/install-zen.sh
            packages/*.sha256
            packages/latest.json
