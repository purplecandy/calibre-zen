services:
  calibre-zen:
    image: ghcr.io/purplecandy/calibre-zen:latest
    container_name: calibre-zen
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      CALIBRE_ZEN_USERNAME: reader
      CALIBRE_ZEN_PASSWORD: change-me
    volumes:
      - ./library:/library
      - ./config:/config
      - ./add-books:/auto-add
    read_only: true
    tmpfs:
      - /tmp
